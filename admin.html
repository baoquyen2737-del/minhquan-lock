<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MINHQUAN LOCK - KEY ADMIN</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at top,#19152f 0%,#080a12 48%,#030409 100%);
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

.header{
    text-align:center;
    padding:25px 10px;
}

.logo{
    width:72px;
    height:72px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#00d9ff,#6847ff);
    font-size:32px;
    font-weight:bold;
    box-shadow:0 0 35px #00d9ff55;
}

.header h1{
    margin:14px 0 5px;
    font-size:25px;
}

.header p{
    margin:0;
    color:#8c96aa;
}

.card{
    background:#0b0e18ee;
    border:1px solid #252c40;
    border-radius:18px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 12px 35px #0008;
}

.card h2{
    margin:0 0 16px;
    color:#00eaff;
    font-size:19px;
}

label{
    display:block;
    margin:11px 0 6px;
    color:#929db2;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #293249;
    background:#050711;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#00eaff;
    box-shadow:0 0 12px #00eaff22;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    margin-top:13px;
    padding:14px;
    border:0;
    border-radius:11px;
    background:linear-gradient(90deg,#00a8c6,#00eaff);
    color:#001016;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.gray{
    background:#20283a;
    color:#fff;
}

.red{
    background:#e93655;
    color:#fff;
}

.status{
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#111624;
    color:#9aa5ba;
    font-size:14px;
}

.success{
    color:#35ff9d;
}

.error{
    color:#ff6376;
}

.hidden{
    display:none !important;
}

.result{
    margin-top:15px;
    padding:16px;
    border-radius:13px;
    background:#050811;
    border:1px solid #27334b;
}

.result-title{
    color:#818ca1;
    font-size:12px;
}

.result-key{
    margin:8px 0;
    color:#00eaff;
    font-size:18px;
    font-weight:bold;
    word-break:break-all;
}

.info{
    margin-top:7px;
    color:#929db1;
    font-size:14px;
}

.info b{
    color:#fff;
}

.key-item{
    margin-top:11px;
    padding:15px;
    border-radius:13px;
    background:#060912;
    border:1px solid #20293c;
}

.key-code{
    color:#00eaff;
    font-weight:bold;
    word-break:break-all;
    margin-top:7px;
}

.key-info{
    margin-top:7px;
    color:#8d98ad;
    font-size:13px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.empty{
    padding:20px;
    text-align:center;
    color:#6f7a90;
}

.login-error{
    margin-top:12px;
    text-align:center;
    color:#ff6376;
    font-size:14px;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .row{
        grid-template-columns:1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            MQ
        </div>

        <h1>MINHQUAN LOCK</h1>

        <p>KEY ADMIN PANEL</p>

    </div>


    <!-- LOGIN ADMIN -->

    <div id="loginBox" class="card">

        <h2>🔐 ADMIN LOGIN</h2>

        <label>Mật khẩu Admin</label>

        <input
            id="adminPassword"
            type="password"
            placeholder="Nhập mật khẩu Admin"
            autocomplete="off"
        >

        <button onclick="adminLogin()">
            🔓 ĐĂNG NHẬP ADMIN
        </button>

        <div id="loginError" class="login-error"></div>

    </div>


    <!-- ADMIN PANEL -->

    <div id="adminPanel" class="hidden">

        <!-- WORKER SECRET -->

        <div class="card">

            <h2>☁️ KẾT NỐI SERVER</h2>

            <label>ADMIN_SECRET của Cloudflare Worker</label>

            <input
                id="workerSecret"
                type="password"
                placeholder="Nhập ADMIN_SECRET"
                autocomplete="off"
            >

            <button onclick="connectWorker()">
                🔗 KẾT NỐI WORKER
            </button>

            <div
                id="status"
                class="status"
            >
                Chưa kết nối Worker
            </div>

        </div>


        <!-- KEY NGÀY -->

        <div class="card">

            <h2>📅 TẠO KEY NGÀY</h2>

            <label>Tên Key</label>

            <input
                id="dayName"
                type="text"
                placeholder="Ví dụ: QUANVIP"
                maxlength="30"
            >

            <div class="row">

                <div>

                    <label>Số ngày</label>

                    <input
                        id="dayDays"
                        type="number"
                        value="30"
                        min="1"
                    >

                </div>

                <div>

                    <label>Số thiết bị</label>

                    <input
                        id="dayDevices"
                        type="number"
                        value="1"
                        min="1"
                    >

                </div>

            </div>

            <button onclick="createDayKey()">
                ⚡ TẠO KEY NGÀY
            </button>

            <div id="dayResult"></div>

        </div>


        <!-- KEY GIỜ -->

        <div class="card">

            <h2>⏱️ TẠO KEY GIỜ</h2>

            <label>Tên Key</label>

            <input
                id="hourName"
                type="text"
                placeholder="Ví dụ: TEST1H"
                maxlength="30"
            >

            <div class="row">

                <div>

                    <label>Số giờ</label>

                    <input
                        id="hourHours"
                        type="number"
                        value="1"
                        min="1"
                    >

                </div>

                <div>

                    <label>Số thiết bị</label>

                    <input
                        id="hourDevices"
                        type="number"
                        value="1"
                        min="1"
                    >

                </div>

            </div>

            <button onclick="createHourKey()">
                ⚡ TẠO KEY GIỜ
            </button>

            <div id="hourResult"></div>

        </div>


        <!-- DANH SÁCH -->

        <div class="card">

            <h2>📋 DANH SÁCH KEY</h2>

            <button
                class="gray"
                onclick="loadKeys()"
            >
                🔄 TẢI LẠI DANH SÁCH
            </button>

            <div id="keyList">

                <div class="empty">
                    Chưa tải danh sách Key.
                </div>

            </div>

        </div>


        <!-- LOGOUT -->

        <div class="card">

            <button
                class="red"
                onclick="adminLogout()"
            >
                🚪 ĐĂNG XUẤT ADMIN
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   ADMIN PASSWORD
========================================= */

const ADMIN_PASSWORD =
    "MQAdmin-9xK7pL2vQ8nR5tW4";


/* =========================================
   CLOUDFLARE WORKER
========================================= */

const API =
    "https://quan-key-admin.baoquyen2737.workers.dev";


let ADMIN_SECRET = "";


/* =========================================
   LOGIN
========================================= */

function adminLogin(){

    const password =
        document
        .getElementById("adminPassword")
        .value;

    if(password !== ADMIN_PASSWORD){

        document
        .getElementById("loginError")
        .textContent =
            "❌ Mật khẩu Admin không đúng.";

        return;
    }

    document
    .getElementById("loginError")
    .textContent = "";

    document
    .getElementById("loginBox")
    .classList
    .add("hidden");

    document
    .getElementById("adminPanel")
    .classList
    .remove("hidden");

}


/* =========================================
   ENTER = LOGIN
========================================= */

document
.getElementById("adminPassword")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){
            adminLogin();
        }

    }
);


/* =========================================
   WORKER HEADERS
========================================= */

function headers(){

    return {

        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer " + ADMIN_SECRET

    };

}


/* =========================================
   CONNECT WORKER
========================================= */

async function connectWorker(){

    const secret =
        document
        .getElementById("workerSecret")
        .value
        .trim();

    if(!secret){

        showStatus(
            "Vui lòng nhập ADMIN_SECRET.",
            "error"
        );

        return;
    }

    ADMIN_SECRET = secret;

    await loadKeys();

}


/* =========================================
   STATUS
========================================= */

function showStatus(message,type=""){

    const box =
        document
        .getElementById("status");

    box.className =
        "status " + type;

    box.textContent =
        message;

}


/* =========================================
   CREATE KEY
========================================= */

async function createKey(
    name,
    hours,
    maxDevices,
    resultId
){

    if(!ADMIN_SECRET){

        showStatus(
            "Hãy kết nối Worker trước.",
            "error"
        );

        return;
    }

    name = name.trim();

    if(!name){

        showStatus(
            "Vui lòng nhập tên Key.",
            "error"
        );

        return;
    }

    if(hours <= 0){

        showStatus(
            "Thời gian phải lớn hơn 0.",
            "error"
        );

        return;
    }

    if(maxDevices <= 0){

        showStatus(
            "Số thiết bị không hợp lệ.",
            "error"
        );

        return;
    }


    /*
       Worker hiện tại dùng DAYS.

       Giờ -> ngày:

       1 giờ  = 1 / 24
       6 giờ  = 6 / 24
       12 giờ = 12 / 24
       24 giờ = 1
    */

    const days =
        hours / 24;


    try{

        const response =
            await fetch(
                API +
                "/api/admin/create-key",
                {

                    method:"POST",

                    headers:headers(),

                    body:JSON.stringify({

                        name:name,

                        days:days,

                        maxDevices:
                            maxDevices

                    })

                }
            );


        const data =
            await response.json();


        if(!data.success){

            showStatus(
                data.message ||
                "Không thể tạo Key.",
                "error"
            );

            return;
        }


        const key =
            data.key;


        /*
           Lưu tên ở máy Admin
           để danh sách hiển thị.
        */

        saveLocalName(
            key,
            name
        );


        document
        .getElementById(resultId)
        .innerHTML = `

            <div class="result">

                <div class="result-title">
                    KEY ĐÃ TẠO
                </div>

                <div class="result-key">
                    ${escapeHtml(key)}
                </div>

                <div class="info">
                    🏷️ Tên:
                    <b>
                        ${escapeHtml(name)}
                    </b>
                </div>

                <div class="info">
                    ⏱️ Thời hạn:
                    <b>
                        ${formatDuration(hours)}
                    </b>
                </div>

                <div class="info">
                    📱 Thiết bị:
                    <b>
                        ${maxDevices}
                    </b>
                </div>

                <button
                    onclick="copyKey('${escapeHtml(key)}')"
                >
                    📋 SAO CHÉP KEY
                </button>

            </div>

        `;


        showStatus(
            "✅ Tạo Key thành công.",
            "success"
        );


        await loadKeys();


    }catch(error){

        showStatus(
            "❌ Không kết nối được Worker.",
            "error"
        );

    }

}


/* =========================================
   CREATE DAY KEY
========================================= */

async function createDayKey(){

    const name =
        document
        .getElementById("dayName")
        .value;

    const days =
        Number(
            document
            .getElementById("dayDays")
            .value
        );

    const devices =
        Number(
            document
            .getElementById("dayDevices")
            .value
        );


    await createKey(
        name,
        days * 24,
        devices,
        "dayResult"
    );

}


/* =========================================
   CREATE HOUR KEY
========================================= */

async function createHourKey(){

    const name =
        document
        .getElementById("hourName")
        .value;

    const hours =
        Number(
            document
            .getElementById("hourHours")
            .value
        );

    const devices =
        Number(
            document
            .getElementById("hourDevices")
            .value
        );


    await createKey(
        name,
        hours,
        devices,
        "hourResult"
    );

}


/* =========================================
   LOAD KEYS
========================================= */

async function loadKeys(){

    if(!ADMIN_SECRET){

        return;
    }


    try{

        const response =
            await fetch(
                API +
                "/api/admin/keys",
                {

                    method:"GET",

                    headers:headers()

                }
            );


        const data =
            await response.json();


        if(!data.success){

            showStatus(
                "❌ ADMIN_SECRET không đúng hoặc Worker từ chối.",
                "error"
            );

            return;
        }


        showStatus(
            "🟢 Worker đang kết nối.",
            "success"
        );


        renderKeys(
            data.keys || []
        );


    }catch(error){

        showStatus(
            "❌ Không kết nối được Worker.",
            "error"
        );

    }

}


/* =========================================
   RENDER
========================================= */

function renderKeys(keys){

    const box =
        document
        .getElementById("keyList");


    if(!keys.length){

        box.innerHTML = `
            <div class="empty">
                Chưa có Key.
            </div>
        `;

        return;
    }


    let html = "";


    keys.forEach(item => {

        const name =
            getLocalName(item.key) ||
            "KEY";


        const expires =
            new Date(
                item.expires_at * 1000
            ).toLocaleString(
                "vi-VN"
            );


        const revoked =
            Number(item.revoked) === 1;


        html += `

            <div class="key-item">

                <div>
                    🏷️
                    <b>
                        ${escapeHtml(name)}
                    </b>
                </div>

                <div class="key-code">
                    🔑
                    ${escapeHtml(item.key)}
                </div>

                <div class="key-info">
                    ⏰ Hết hạn:
                    ${expires}
                </div>

                <div class="key-info">
                    📱 Thiết bị:
                    ${item.max_devices}
                </div>

                <div class="key-info">

                    ${
                        revoked

                        ? `
                            <span class="error">
                                🚫 Đã thu hồi
                            </span>
                        `

                        : `
                            <span class="success">
                                🟢 Đang hoạt động
                            </span>
                        `
                    }

                </div>

                <div class="actions">

                    <button
                        class="gray"
                        onclick="copyKey('${escapeHtml(item.key)}')"
                    >
                        📋 SAO CHÉP
                    </button>

                    ${
                        !revoked

                        ? `
                            <button
                                class="red"
                                onclick="revokeKey('${escapeHtml(item.key)}')"
                            >
                                🚫 THU HỒI
                            </button>
                        `

                        : ""
                    }

                </div>

            </div>

        `;

    });


    box.innerHTML =
        html;

}


/* =========================================
   REVOKE
========================================= */

async function revokeKey(key){

    if(
        !confirm(
            "Bạn có chắc muốn thu hồi Key này?"
        )
    ){

        return;
    }


    try{

        const response =
            await fetch(
                API +
                "/api/admin/revoke-key",
                {

                    method:"POST",

                    headers:headers(),

                    body:JSON.stringify({
                        key:key
                    })

                }
            );


        const data =
            await response.json();


        if(!data.success){

            showStatus(
                data.message ||
                "Không thể thu hồi Key.",
                "error"
            );

            return;
        }


        showStatus(
            "✅ Đã thu hồi Key.",
            "success"
        );


        await loadKeys();


    }catch(error){

        showStatus(
            "❌ Không kết nối được Worker.",
            "error"
        );

    }

}


/* =========================================
   COPY
========================================= */

async function copyKey(key){

    try{

        await navigator
        .clipboard
        .writeText(key);

        showStatus(
            "📋 Đã sao chép Key.",
            "success"
        );

    }catch{

        prompt(
            "Sao chép Key:",
            key
        );

    }

}


/* =========================================
   LOCAL NAME
========================================= */

function saveLocalName(
    key,
    name
){

    let names =
        JSON.parse(
            localStorage.getItem(
                "mq_key_names"
            ) || "{}"
        );


    names[key] =
        name;


    localStorage.setItem(
        "mq_key_names",
        JSON.stringify(names)
    );

}


function getLocalName(key){

    const names =
        JSON.parse(
            localStorage.getItem(
                "mq_key_names"
            ) || "{}"
        );


    return names[key] || "";

}


/* =========================================
   FORMAT
========================================= */

function formatDuration(hours){

    if(hours < 24){

        return hours + " giờ";

    }


    const days =
        hours / 24;


    if(
        Number.isInteger(days)
    ){

        return days + " ngày";

    }


    return hours + " giờ";

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   LOGOUT
========================================= */

function adminLogout(){

    ADMIN_SECRET = "";

    document
    .getElementById("adminPassword")
    .value = "";

    document
    .getElementById("workerSecret")
    .value = "";

    document
    .getElementById("adminPanel")
    .classList
    .add("hidden");

    document
    .getElementById("loginBox")
    .classList
    .remove("hidden");

}

</script>

</body>
</html>
