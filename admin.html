<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINHQUAN LOCK — KEY ADMIN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#24104d 0,#090712 45%,#05050a 100%);
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:18px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.logo{
  width:72px;
  height:72px;
  margin:auto;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  background:linear-gradient(135deg,#00eaff,#8b5cf6,#ff2bd6);
  box-shadow:0 0 35px #7c3cff66;
}

h1{
  margin:12px 0 5px;
  font-size:24px;
}

.subtitle{
  color:#aaa;
  font-size:13px;
}

.card{
  background:rgba(18,16,32,.88);
  border:1px solid #ffffff16;
  border-radius:18px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 10px 35px #0007;
}

.card h2{
  margin:0 0 15px;
  font-size:17px;
}

label{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-bottom:6px;
}

input{
  width:100%;
  border:1px solid #ffffff18;
  outline:none;
  border-radius:12px;
  background:#090811;
  color:white;
  padding:13px;
  font-size:14px;
}

input:focus{
  border-color:#00eaff;
  box-shadow:0 0 15px #00eaff22;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,#00bfff,#7c3cff,#e92bff);
  box-shadow:0 0 20px #7c3cff33;
}

button:active{
  transform:scale(.98);
}

.btn-secondary{
  background:#ffffff0d;
  border:1px solid #ffffff16;
}

.btn-danger{
  background:linear-gradient(90deg,#ff304f,#a60028);
}

.status{
  margin-top:12px;
  padding:11px;
  border-radius:10px;
  display:none;
  font-size:13px;
}

.success{
  display:block;
  background:#00ff8815;
  border:1px solid #00ff8844;
  color:#63ffb0;
}

.error{
  display:block;
  background:#ff304015;
  border:1px solid #ff304044;
  color:#ff8998;
}

.key-box{
  margin-top:12px;
  padding:15px;
  border-radius:14px;
  background:#05050c;
  border:1px solid #00eaff33;
}

.key-value{
  word-break:break-all;
  color:#00eaff;
  font-size:16px;
  font-weight:bold;
  margin:7px 0 12px;
}

.small{
  color:#999;
  font-size:12px;
}

.key-item{
  padding:15px 0;
  border-bottom:1px solid #ffffff12;
}

.key-item:last-child{
  border-bottom:0;
}

.key-name{
  font-weight:bold;
  color:#fff;
  margin-bottom:7px;
}

.key-code{
  color:#00eaff;
  word-break:break-all;
  font-size:13px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:10px 0;
}

.badge{
  padding:5px 8px;
  border-radius:8px;
  background:#ffffff0b;
  color:#bbb;
  font-size:11px;
}

.badge.active{
  color:#65ffb0;
  background:#00ff8815;
}

.badge.revoked{
  color:#ff7183;
  background:#ff304015;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.empty{
  text-align:center;
  padding:25px 5px;
  color:#777;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:15px;
}

@media(max-width:520px){
  .row{
    grid-template-columns:1fr;
  }

  .container{
    padding:12px;
  }

  .card{
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🔐</div>
    <h1>MINHQUAN LOCK</h1>
    <div class="subtitle">KEY ADMIN PANEL</div>
  </div>

  <!-- ADMIN SECRET -->
  <div class="card">
    <h2>🔑 Xác thực Admin</h2>

    <label>ADMIN_SECRET</label>

    <input
      id="adminSecret"
      type="password"
      placeholder="Nhập ADMIN_SECRET..."
      autocomplete="off"
    >

    <br><br>

    <button onclick="saveSecret()">
      🔓 XÁC THỰC ADMIN
    </button>

    <div id="status" class="status"></div>
  </div>


  <!-- TẠO KEY NGÀY -->
  <div class="card">

    <h2>📅 Tạo Key theo ngày</h2>

    <label>Tên Key</label>
    <input
      id="dayName"
      type="text"
      placeholder="Ví dụ: VIP 30 NGÀY"
      maxlength="40"
    >

    <div class="row">

      <div>
        <label>Số ngày</label>
        <input
          id="days"
          type="number"
          value="30"
          min="1"
          step="1"
        >
      </div>

      <div>
        <label>Số thiết bị tối đa</label>
        <input
          id="dayDevices"
          type="number"
          value="1"
          min="1"
          step="1"
        >
      </div>

    </div>

    <button onclick="createDayKey()">
      📅 TẠO KEY NGÀY
    </button>

    <div id="newDayKey"></div>

  </div>


  <!-- TẠO KEY GIỜ -->
  <div class="card">

    <h2>⏱️ Tạo Key theo giờ</h2>

    <label>Tên Key</label>
    <input
      id="hourName"
      type="text"
      placeholder="Ví dụ: TEST 6 GIỜ"
      maxlength="40"
    >

    <div class="row">

      <div>
        <label>Số giờ</label>
        <input
          id="hours"
          type="number"
          value="1"
          min="1"
          step="1"
        >
      </div>

      <div>
        <label>Số thiết bị tối đa</label>
        <input
          id="hourDevices"
          type="number"
          value="1"
          min="1"
          step="1"
        >
      </div>

    </div>

    <button onclick="createHourKey()">
      ⚡ TẠO KEY GIỜ
    </button>

    <div id="newHourKey"></div>

  </div>


  <!-- DANH SÁCH KEY -->
  <div class="card">

    <h2>📋 Danh sách Key</h2>

    <button
      class="btn-secondary"
      onclick="loadKeys()"
    >
      🔄 TẢI LẠI DANH SÁCH
    </button>

    <div id="keysList">
      <div class="empty">
        Chưa tải danh sách Key
      </div>
    </div>

  </div>

</div>


<script>

const API =
  "https://quan-key-admin.baoquyen2737.workers.dev";

let ADMIN_SECRET =
  localStorage.getItem("mq_admin_secret") || "";


/* =========================
   STATUS
========================= */

function showStatus(message,type="success"){

  const box =
    document.getElementById("status");

  box.textContent = message;

  box.className =
    "status " + type;

}


/* =========================
   SAVE SECRET
========================= */

function saveSecret(){

  const value =
    document.getElementById("adminSecret").value.trim();

  if(!value){

    showStatus(
      "Hãy nhập ADMIN_SECRET.",
      "error"
    );

    return;
  }

  ADMIN_SECRET = value;

  localStorage.setItem(
    "mq_admin_secret",
    value
  );

  showStatus(
    "Đã lưu ADMIN_SECRET trên thiết bị này.",
    "success"
  );

  loadKeys();
}


/* =========================
   HEADERS
========================= */

function headers(){

  return {
    "Content-Type":"application/json",
    "Authorization":
      "Bearer " + ADMIN_SECRET
  };

}


/* =========================
   CHECK SECRET
========================= */

function checkSecret(){

  if(!ADMIN_SECRET){

    showStatus(
      "Hãy nhập ADMIN_SECRET trước.",
      "error"
    );

    return false;
  }

  return true;
}


/* =========================
   CREATE DAY KEY
========================= */

async function createDayKey(){

  if(!checkSecret()) return;

  const name =
    document.getElementById("dayName")
      .value.trim();

  const days =
    Number(
      document.getElementById("days").value
    );

  const maxDevices =
    Number(
      document.getElementById("dayDevices").value
    );

  if(!name){

    showStatus(
      "Hãy nhập tên Key.",
      "error"
    );

    return;
  }

  if(days < 1 || maxDevices < 1){

    showStatus(
      "Số ngày và thiết bị phải lớn hơn 0.",
      "error"
    );

    return;
  }

  try{

    const response =
      await fetch(
        API + "/api/admin/create-key",
        {
          method:"POST",
          headers:headers(),
          body:JSON.stringify({
            name:name,
            days:days,
            maxDevices:maxDevices
          })
        }
      );

    const data =
      await response.json();

    if(!data.success){

      showStatus(
        data.message ||
        "Không thể tạo Key.",
        "error"
      );

      return;
    }

    document.getElementById(
      "newDayKey"
    ).innerHTML = createResultHTML(
      data.key,
      name,
      days + " ngày",
      maxDevices
    );

    showStatus(
      "Tạo Key ngày thành công.",
      "success"
    );

    loadKeys();

  }catch(error){

    showStatus(
      "Không kết nối được Worker.",
      "error"
    );

  }

}


/* =========================
   CREATE HOUR KEY
========================= */

async function createHourKey(){

  if(!checkSecret()) return;

  const name =
    document.getElementById("hourName")
      .value.trim();

  const hours =
    Number(
      document.getElementById("hours").value
    );

  const maxDevices =
    Number(
      document.getElementById("hourDevices").value
    );

  if(!name){

    showStatus(
      "Hãy nhập tên Key.",
      "error"
    );

    return;
  }

  if(hours < 1 || maxDevices < 1){

    showStatus(
      "Số giờ và thiết bị phải lớn hơn 0.",
      "error"
    );

    return;
  }

  try{

    /*
      Worker hiện tại dùng đơn vị ngày.
      1 giờ = 1/24 ngày.
    */

    const days = hours / 24;

    const response =
      await fetch(
        API + "/api/admin/create-key",
        {
          method:"POST",
          headers:headers(),
          body:JSON.stringify({
            name:name,
            days:days,
            maxDevices:maxDevices
          })
        }
      );

    const data =
      await response.json();

    if(!data.success){

      showStatus(
        data.message ||
        "Không thể tạo Key giờ.",
        "error"
      );

      return;
    }

    document.getElementById(
      "newHourKey"
    ).innerHTML = createResultHTML(
      data.key,
      name,
      hours + " giờ",
      maxDevices
    );

    showStatus(
      "Tạo Key giờ thành công.",
      "success"
    );

    loadKeys();

  }catch(error){

    showStatus(
      "Không kết nối được Worker.",
      "error"
    );

  }

}


/* =========================
   RESULT BOX
========================= */

function createResultHTML(
  key,
  name,
  duration,
  devices
){

  return `

    <div class="key-box">

      <div class="small">
        KEY MỚI
      </div>

      <div class="key-value">
        ${escapeHTML(key)}
      </div>

      <div class="small">
        Tên: ${escapeHTML(name)}
      </div>

      <div class="small">
        Thời hạn: ${escapeHTML(duration)}
      </div>

      <div class="small">
        Thiết bị: ${devices}
      </div>

      <br>

      <button
        onclick="copyKey('${escapeJS(key)}')"
      >
        📋 SAO CHÉP KEY
      </button>

    </div>

  `;

}


/* =========================
   LOAD KEYS
========================= */

async function loadKeys(){

  if(!checkSecret()) return;

  const box =
    document.getElementById("keysList");

  box.innerHTML =
    '<div class="loading">⏳ Đang tải...</div>';

  try{

    const response =
      await fetch(
        API + "/api/admin/keys",
        {
          method:"GET",
          headers:headers()
        }
      );

    const data =
      await response.json();

    if(!data.success){

      box.innerHTML =
        '<div class="empty">Không thể tải Key.</div>';

      showStatus(
        data.message ||
        "Không có quyền truy cập.",
        "error"
      );

      return;
    }

    if(!data.keys || data.keys.length === 0){

      box.innerHTML =
        '<div class="empty">Chưa có Key nào.</div>';

      return;
    }

    box.innerHTML =
      data.keys.map(renderKey).join("");

  }catch(error){

    box.innerHTML =
      '<div class="empty">Không kết nối được Worker.</div>';

  }

}


/* =========================
   RENDER KEY
========================= */

function renderKey(item){

  const now =
    Math.floor(Date.now()/1000);

  const expired =
    Number(item.expires_at) <= now;

  const revoked =
    Number(item.revoked) === 1;

  let statusText =
    "ĐANG HOẠT ĐỘNG";

  let statusClass =
    "active";

  if(revoked){

    statusText =
      "ĐÃ THU HỒI";

    statusClass =
      "revoked";

  }else if(expired){

    statusText =
      "ĐÃ HẾT HẠN";

    statusClass =
      "revoked";

  }

  const expireDate =
    new Date(
      Number(item.expires_at) * 1000
    ).toLocaleString("vi-VN");

  const name =
    item.name || "MINHQUAN KEY";

  return `

    <div class="key-item">

      <div class="key-name">
        🏷️ ${escapeHTML(name)}
      </div>

      <div class="key-code">
        ${escapeHTML(item.key)}
      </div>

      <div class="meta">

        <span class="badge ${statusClass}">
          ${statusText}
        </span>

        <span class="badge">
          👥 ${Number(item.max_devices)} thiết bị
        </span>

        <span class="badge">
          ⏰ ${expireDate}
        </span>

      </div>

      <div class="actions">

        <button
          class="btn-secondary"
          onclick="copyKey('${escapeJS(item.key)}')"
        >
          📋 COPY
        </button>

        ${
          revoked || expired
          ? ""
          :
          `
          <button
            class="btn-danger"
            onclick="revokeKey('${escapeJS(item.key)}')"
          >
            🗑️ THU HỒI
          </button>
          `
        }

      </div>

    </div>

  `;

}


/* =========================
   REVOKE
========================= */

async function revokeKey(key){

  if(!checkSecret()) return;

  const ok =
    confirm(
      "Bạn có chắc muốn thu hồi Key này?"
    );

  if(!ok) return;

  try{

    const response =
      await fetch(
        API + "/api/admin/revoke-key",
        {
          method:"POST",
          headers:headers(),
          body:JSON.stringify({
            key:key
          })
        }
      );

    const data =
      await response.json();

    if(!data.success){

      showStatus(
        data.message ||
        "Không thể thu hồi Key.",
        "error"
      );

      return;
    }

    showStatus(
      "Đã thu hồi Key.",
      "success"
    );

    loadKeys();

  }catch(error){

    showStatus(
      "Không kết nối được Worker.",
      "error"
    );

  }

}


/* =========================
   COPY
========================= */

async function copyKey(key){

  try{

    await navigator.clipboard.writeText(key);

    showStatus(
      "Đã sao chép Key.",
      "success"
    );

  }catch(error){

    showStatus(
      "Không thể sao chép tự động.",
      "error"
    );

  }

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeJS(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}


/* =========================
   AUTO LOAD SECRET
========================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    if(ADMIN_SECRET){

      document.getElementById(
        "adminSecret"
      ).value = ADMIN_SECRET;

      loadKeys();

    }

  }
);

</script>

</body>
</html>
