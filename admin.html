<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MINHQUAN LOCK - KEY ADMIN</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#17142d 0,#080a12 45%,#030409 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

.header{
    text-align:center;
    padding:25px 10px;
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#00d9ff,#6847ff);
    font-size:32px;
    font-weight:bold;
    box-shadow:0 0 35px #00d9ff44;
}

.header h1{
    margin:14px 0 5px;
    font-size:25px;
}

.header p{
    margin:0;
    color:#8993a8;
}

.card{
    background:#0b0e18;
    border:1px solid #242b3e;
    border-radius:18px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 12px 35px #0008;
}

.card h2{
    margin:0 0 16px;
    color:#00eaff;
    font-size:19px;
}

.hour h2{
    color:#b57cff;
}

label{
    display:block;
    margin:10px 0 6px;
    color:#8e99ae;
    font-size:13px;
}

input{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #293249;
    background:#050711;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#00eaff;
    box-shadow:0 0 12px #00eaff22;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    margin-top:13px;
    padding:14px;
    border:0;
    border-radius:11px;
    background:linear-gradient(90deg,#00a8c6,#00eaff);
    color:#001016;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.1);
}

.gray{
    background:#20283a;
    color:#fff;
}

.red{
    background:#e93655;
    color:#fff;
}

.status{
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#111624;
    color:#9aa5ba;
    font-size:14px;
}

.success{
    color:#36ff9d;
}

.error{
    color:#ff6376;
}

.result{
    margin-top:15px;
    padding:16px;
    border-radius:13px;
    background:#050811;
    border:1px solid #27334b;
}

.result-title{
    color:#818ca1;
    font-size:12px;
}

.result-key{
    margin:8px 0;
    color:#00eaff;
    font-size:18px;
    font-weight:bold;
    word-break:break-all;
}

.info{
    margin-top:7px;
    color:#929db1;
    font-size:14px;
}

.info b{
    color:#fff;
}

.key-item{
    margin-top:11px;
    padding:15px;
    border-radius:13px;
    background:#060912;
    border:1px solid #20293c;
}

.key-code{
    color:#00eaff;
    font-weight:bold;
    word-break:break-all;
    margin-top:6px;
}

.key-info{
    margin-top:7px;
    color:#8d98ad;
    font-size:13px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.empty{
    padding:20px;
    text-align:center;
    color:#6f7a90;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .row{
        grid-template-columns:1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            MQ
        </div>

        <h1>MINHQUAN LOCK</h1>

        <p>KEY ADMIN PANEL</p>

    </div>


    <!-- ADMIN -->

    <div class="card">

        <h2>🔐 XÁC THỰC ADMIN</h2>

        <label>ADMIN_SECRET</label>

        <input
            id="secret"
            type="password"
            placeholder="Nhập ADMIN_SECRET"
            autocomplete="off"
        >

        <button onclick="loginAdmin()">
            🔓 XÁC THỰC
        </button>

        <div
            id="status"
            class="status"
        >
            Chưa xác thực
        </div>

    </div>


    <!-- KEY NGÀY -->

    <div class="card">

        <h2>➕ TẠO KEY NGÀY</h2>

        <label>Tên Key</label>

        <input
            id="dayName"
            type="text"
            placeholder="Ví dụ: QUANVIP"
            maxlength="30"
        >

        <div class="row">

            <div>

                <label>Số ngày</label>

                <input
                    id="dayDays"
                    type="number"
                    value="30"
                    min="1"
                    step="1"
                >

            </div>

            <div>

                <label>Số thiết bị</label>

                <input
                    id="dayDevices"
                    type="number"
                    value="1"
                    min="1"
                    step="1"
                >

            </div>

        </div>

        <button onclick="createDayKey()">
            ⚡ TẠO KEY NGÀY
        </button>

        <div id="dayResult"></div>

    </div>


    <!-- KEY GIỜ -->

    <div class="card hour">

        <h2>⏱️ TẠO KEY GIỜ</h2>

        <label>Tên Key</label>

        <input
            id="hourName"
            type="text"
            placeholder="Ví dụ: TEST1H"
            maxlength="30"
        >

        <div class="row">

            <div>

                <label>Số giờ</label>

                <input
                    id="hourHours"
                    type="number"
                    value="1"
                    min="1"
                    step="1"
                >

            </div>

            <div>

                <label>Số thiết bị</label>

                <input
                    id="hourDevices"
                    type="number"
                    value="1"
                    min="1"
                    step="1"
                >

            </div>

        </div>

        <button onclick="createHourKey()">
            ⚡ TẠO KEY GIỜ
        </button>

        <div id="hourResult"></div>

    </div>


    <!-- DANH SÁCH -->

    <div class="card">

        <h2>📋 DANH SÁCH KEY</h2>

        <button
            class="gray"
            onclick="loadKeys()"
        >
            🔄 TẢI LẠI
        </button>

        <div id="keyList">

            <div class="empty">
                Chưa tải danh sách.
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================
   WORKER
===================================== */

const API =
    "https://quan-key-admin.baoquyen2737.workers.dev";


let ADMIN_SECRET = "";


/* =====================================
   STATUS
===================================== */

function showStatus(message, type=""){

    const box =
        document.getElementById("status");

    box.className =
        "status " + type;

    box.textContent =
        message;
}


/* =====================================
   ADMIN LOGIN
===================================== */

async function loginAdmin(){

    const secret =
        document
            .getElementById("secret")
            .value
            .trim();

    if(!secret){

        showStatus(
            "Vui lòng nhập ADMIN_SECRET.",
            "error"
        );

        return;
    }

    ADMIN_SECRET = secret;

    await loadKeys();
}


/* =====================================
   HEADERS
===================================== */

function headers(){

    return {

        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer " + ADMIN_SECRET

    };
}


/* =====================================
   CREATE KEY
===================================== */

async function createKey({
    name,
    hours,
    maxDevices,
    resultId
}){

    if(!ADMIN_SECRET){

        showStatus(
            "Hãy xác thực Admin trước.",
            "error"
        );

        return;
    }


    name = name.trim();


    if(!name){

        showStatus(
            "Vui lòng nhập tên Key.",
            "error"
        );

        return;
    }


    if(hours <= 0){

        showStatus(
            "Thời gian phải lớn hơn 0.",
            "error"
        );

        return;
    }


    if(maxDevices <= 0){

        showStatus(
            "Số thiết bị phải lớn hơn 0.",
            "error"
        );

        return;
    }


    /*
       QUAN TRỌNG:

       Worker hiện tại dùng DAYS.

       Vì vậy:

       1 giờ  = 1 / 24 ngày
       6 giờ  = 6 / 24 ngày
       12 giờ = 12 / 24 ngày
       24 giờ = 1 ngày
    */

    const days =
        hours / 24;


    try{

        const response =
            await fetch(
                API + "/api/admin/create-key",
                {
                    method:"POST",

                    headers:headers(),

                    body:JSON.stringify({

                        /*
                           Worker cũ sẽ bỏ qua
                           name, nhưng gửi kèm
                           để sau này dễ nâng cấp.
                        */

                        name:name,

                        days:days,

                        maxDevices:maxDevices

                    })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            showStatus(
                data.message ||
                "Không thể tạo Key.",
                "error"
            );

            return;
        }


        const key =
            data.key;


        /*
           Lưu tên + Key ở trình duyệt
           để admin dễ xem lại.
        */

        saveLocalKey({
            name:name,
            key:key,
            hours:hours,
            maxDevices:maxDevices,
            expires_at:data.expires_at
        });


        document
            .getElementById(resultId)
            .innerHTML = `

                <div class="result">

                    <div class="result-title">
                        KEY ĐÃ TẠO
                    </div>

                    <div class="result-key">
                        ${escapeHtml(key)}
                    </div>

                    <div class="info">
                        🏷️ Tên:
                        <b>
                            ${escapeHtml(name)}
                        </b>
                    </div>

                    <div class="info">
                        ⏱️ Thời hạn:
                        <b>
                            ${formatDuration(hours)}
                        </b>
                    </div>

                    <div class="info">
                        📱 Thiết bị:
                        <b>
                            ${maxDevices}
                        </b>
                    </div>

                    <button
                        onclick="copyKey('${escapeHtml(key)}')"
                    >
                        📋 SAO CHÉP KEY
                    </button>

                </div>
            `;


        showStatus(
            "Tạo Key thành công.",
            "success"
        );


        await loadKeys();


    }catch(error){

        showStatus(
            "Không kết nối được Worker.",
            "error"
        );

    }
}


/* =====================================
   CREATE DAY KEY
===================================== */

async function createDayKey(){

    const name =
        document
            .getElementById("dayName")
            .value;

    const days =
        Number(
            document
                .getElementById("dayDays")
                .value
        );

    const devices =
        Number(
            document
                .getElementById("dayDevices")
                .value
        );


    await createKey({

        name:name,

        hours:
            days * 24,

        maxDevices:
            devices,

        resultId:
            "dayResult"

    });
}


/* =====================================
   CREATE HOUR KEY
===================================== */

async function createHourKey(){

    const name =
        document
            .getElementById("hourName")
            .value;

    const hours =
        Number(
            document
                .getElementById("hourHours")
                .value
        );

    const devices =
        Number(
            document
                .getElementById("hourDevices")
                .value
        );


    await createKey({

        name:name,

        hours:hours,

        maxDevices:
            devices,

        resultId:
            "hourResult"

    });
}


/* =====================================
   LOAD KEYS
===================================== */

async function loadKeys(){

    if(!ADMIN_SECRET){

        return;
    }


    try{

        const response =
            await fetch(
                API + "/api/admin/keys",
                {
                    method:"GET",
                    headers:headers()
                }
            );


        const data =
            await response.json();


        if(!data.success){

            showStatus(
                data.message ||
                "ADMIN_SECRET không đúng.",
                "error"
            );

            return;
        }


        showStatus(
            "Admin đã xác thực.",
            "success"
        );


        renderKeys(data.keys);


    }catch(error){

        showStatus(
            "Không kết nối được Worker.",
            "error"
        );

    }
}


/* =====================================
   RENDER KEYS
===================================== */

function renderKeys(keys){

    const box =
        document.getElementById("keyList");


    if(
        !keys ||
        keys.length === 0
    ){

        box.innerHTML = `

            <div class="empty">
                Chưa có Key.
            </div>

        `;

        return;
    }


    let html = "";


    keys.forEach(item => {

        const expires =
            new Date(
                item.expires_at * 1000
            ).toLocaleString(
                "vi-VN"
            );


        const revoked =
            Number(item.revoked) === 1;


        const local =
            getLocalKey(item.key);


        const name =
            local
                ? local.name
                : "Không tên";


        html += `

            <div class="key-item">

                <div>
                    🏷️
                    <b>
                        ${escapeHtml(name)}
                    </b>
                </div>

                <div class="key-code">
                    🔑
                    ${escapeHtml(item.key)}
                </div>

                <div class="key-info">
                    ⏰ Hết hạn:
                    ${expires}
                </div>

                <div class="key-info">
                    📱 Thiết bị:
                    ${item.max_devices}
                </div>

                <div class="key-info">

                    ${
                        revoked

                        ? `
                            <span class="error">
                                🚫 Đã thu hồi
                            </span>
                        `

                        : `
                            <span class="success">
                                🟢 Đang hoạt động
                            </span>
                        `
                    }

                </div>

                <div class="actions">

                    <button
                        class="gray"
                        onclick="copyKey('${escapeHtml(item.key)}')"
                    >
                        📋 SAO CHÉP
                    </button>

                    ${
                        !revoked

                        ? `

                            <button
                                class="red"
                                onclick="revokeKey('${escapeHtml(item.key)}')"
                            >
                                🚫 THU HỒI
                            </button>

                        `

                        : ""
                    }

                </div>

            </div>

        `;

    });


    box.innerHTML =
        html;
}


/* =====================================
   REVOKE
===================================== */

async function revokeKey(key){

    if(
        !confirm(
            "Bạn có chắc muốn thu hồi Key này?"
        )
    ){

        return;
    }


    try{

        const response =
            await fetch(
                API + "/api/admin/revoke-key",
                {
                    method:"POST",

                    headers:headers(),

                    body:JSON.stringify({
                        key:key
                    })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            showStatus(
                data.message ||
                "Không thể thu hồi Key.",
                "error"
            );

            return;
        }


        showStatus(
            "Đã thu hồi Key.",
            "success"
        );


        await loadKeys();


    }catch(error){

        showStatus(
            "Không kết nối được Worker.",
            "error"
        );

    }
}


/* =====================================
   COPY
===================================== */

async function copyKey(key){

    try{

        await navigator
            .clipboard
            .writeText(key);


        showStatus(
            "Đã sao chép Key.",
            "success"
        );

    }catch{

        prompt(
            "Sao chép Key:",
            key
        );
    }
}


/* =====================================
   LOCAL KEY NAME
===================================== */

function saveLocalKey(item){

    let list =
        JSON.parse(
            localStorage.getItem(
                "mq_admin_keys"
            ) || "[]"
        );


    list =
        list.filter(
            x => x.key !== item.key
        );


    list.unshift(item);


    if(list.length > 100){

        list =
            list.slice(0,100);
    }


    localStorage.setItem(
        "mq_admin_keys",
        JSON.stringify(list)
    );
}


function getLocalKey(key){

    const list =
        JSON.parse(
            localStorage.getItem(
                "mq_admin_keys"
            ) || "[]"
        );


    return list.find(
        x => x.key === key
    );
}


/* =====================================
   DURATION
===================================== */

function formatDuration(hours){

    if(hours < 24){

        return hours + " giờ";
    }


    const days =
        hours / 24;


    if(Number.isInteger(days)){

        return days + " ngày";
    }


    return hours + " giờ";
}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}

</script>

</body>
</html>
