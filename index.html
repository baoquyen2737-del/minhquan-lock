<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MINHQUAN LOCK - Bảo trì</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:
        radial-gradient(circle at top,#241044 0%,#0b0712 45%,#050509 100%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,Arial,sans-serif;
}

.container{
    width:100%;
    max-width:430px;
    text-align:center;
}

.logo{
    width:145px;
    height:145px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #a855f7;
    box-shadow:
        0 0 20px #a855f7,
        0 0 60px #7c3aed66;
    margin-bottom:25px;
}

.title{
    font-size:29px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:8px;
}

.subtitle{
    color:#9ca3af;
    font-size:11px;
    letter-spacing:4px;
    margin-bottom:30px;
}

.box{
    background:rgba(15,17,28,.88);
    border:1px solid #303548;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        inset 0 0 30px rgba(168,85,247,.04);
}

.icon{
    width:70px;
    height:70px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    background:#a855f718;
    border:1px solid #a855f755;
}

.maintenance{
    font-size:22px;
    font-weight:900;
    color:#c084fc;
    margin-bottom:12px;
}

.text{
    color:#9ca3af;
    font-size:14px;
    line-height:1.7;
}

.status{
    margin-top:22px;
    padding:11px 16px;
    border-radius:12px;
    background:#a855f710;
    border:1px solid #a855f733;
    color:#c084fc;
    font-size:12px;
    font-weight:700;
}

.footer{
    margin-top:22px;
    color:#555d70;
    font-size:10px;
    letter-spacing:2px;
}

.dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#c084fc;
    box-shadow:0 0 10px #c084fc;
    margin-right:6px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:.35;
        transform:scale(.8);
    }
    50%{
        opacity:1;
        transform:scale(1);
    }
}
</style>
</head>

<body>

<div class="container">

    <img
        class="logo"
        src="./234189E4-4038-499F-82C7-720F6B46CDEE.png"
        alt="MINHQUAN LOCK"
    >

    <div class="title">
        MINHQUAN LOCK
    </div>

    <div class="subtitle">
        NETWORK CONTROL
    </div>

    <div class="box">

        <div class="icon">
            🔧
        </div>

        <div class="maintenance">
            ĐANG BẢO TRÌ
        </div>

        <div class="text">
            Hệ thống MINHQUAN LOCK hiện đang
            được bảo trì và nâng cấp.
            <br>
            Vui lòng quay lại sau.
        </div>

        <div class="status">
            <span class="dot"></span>
            HỆ THỐNG ĐANG BẢO TRÌ
        </div>

    </div>

    <div class="footer">
        MINHQUAN LOCK © 2026
    </div>

</div>

</body>
</html>
