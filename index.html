<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08050d">
<title>MINHQUAN LOCK</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;background:radial-gradient(circle at top,#35105c,#08050d 65%);
 color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.card{
 width:100%;max-width:420px;padding:30px 22px;text-align:center;
 background:#100b18;border:1px solid #713bb0;border-radius:24px;
 box-shadow:0 0 40px #702dcc55
}
.logo{
 width:100px;height:100px;margin:auto;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(145deg,#a34dff,#260b40);
 border:3px solid #bd79ff;font-size:29px;font-weight:900
}
h1{font-size:28px;letter-spacing:3px;margin:18px 0 7px}
.sub{color:#aaa;font-size:14px;margin-bottom:25px}
.box{padding:18px;background:#08060c;border-radius:16px}
input{
 width:100%;padding:15px;border-radius:11px;border:1px solid #54316e;
 background:#141019;color:#fff;text-align:center;font-size:15px;outline:none
}
button{
 width:100%;margin-top:13px;padding:15px;border:0;border-radius:11px;
 background:linear-gradient(90deg,#762cff,#ad52ff);
 color:#fff;font-size:16px;font-weight:bold
}
#msg{margin-top:15px;min-height:22px;font-size:14px}
.ok{color:#55e68a}.err{color:#ff687b}
.info{margin-top:22px;color:#777;font-size:12px}
</style>
</head>

<body>
<div class="card">

<div class="logo">MQ</div>

<h1>MINHQUAN LOCK</h1>
<div class="sub">Nhập key để bắt đầu</div>

<div class="box">
<input id="key"
       type="text"
       placeholder="MQ-XXXX-XXXX-XXXX"
       autocomplete="off">

<button onclick="activate()">KÍCH HOẠT</button>

<div id="msg"></div>
</div>

<div class="info">© 2026 MinhQuan Lock</div>

</div>

<script>
/* KEY TEST */
const validKeys = [
  "MQ-MINHQUAN-2026",
  "MQ-TEST-1234-5678",
  "MQ-VIP-2026-9999"
];

function activate(){
  const input = document.getElementById("key");
  const msg = document.getElementById("msg");
  const key = input.value.trim().toUpperCase();

  msg.className = "";

  if(!key){
    msg.textContent = "⚠️ Vui lòng nhập key.";
    msg.className = "err";
    return;
  }

  if(validKeys.includes(key)){
    msg.textContent = "✅ Kích hoạt thành công!";
    msg.className = "ok";
  }else{
    msg.textContent = "❌ Key không hợp lệ.";
    msg.className = "err";
  }
}
</script>

</body>
</html>
