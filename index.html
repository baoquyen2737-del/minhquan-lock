<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MinhQuan Lock">

<title>MINHQUAN LOCK</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #35105f 0%, #10091a 35%, #050507 75%);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: rgba(15, 10, 24, 0.94);
    border: 1px solid #6e35a5;
    border-radius: 24px;
    padding: 30px 22px;
    box-shadow: 0 0 45px rgba(137, 43, 226, .25);
    text-align: center;
}

.logo {
    width: 105px;
    height: 105px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(145deg, #8b3dff, #240d3d);
    border: 3px solid #b46cff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1px;
    box-shadow: 0 0 30px rgba(157, 70, 255, .5);
}

h1 {
    font-size: 30px;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa1b8;
    font-size: 14px;
    margin-bottom: 28px;
}

.box {
    background: #0a0810;
    border: 1px solid #352244;
    border-radius: 16px;
    padding: 18px;
}

label {
    display: block;
    text-align: left;
    color: #cfc4da;
    font-size: 13px;
    margin-bottom: 9px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #51306d;
    background: #121019;
    color: white;
    outline: none;
    font-size: 15px;
    text-align: center;
}

input:focus {
    border-color: #a75cff;
    box-shadow: 0 0 12px rgba(167, 92, 255, .25);
}

button {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #762cff, #a94dff);
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

#message {
    margin-top: 15px;
    min-height: 20px;
    font-size: 14px;
    color: #bda8d0;
}

.footer {
    margin-top: 24px;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">MQ</div>

    <h1>MINHQUAN LOCK</h1>

    <div class="subtitle">
        Nhập key để bắt đầu
    </div>

    <div class="box">

        <label for="key">KEY KÍCH HOẠT</label>

        <input
            id="key"
            type="text"
            placeholder="MQ-XXXX-XXXX-XXXX"
            autocomplete="off"
        >

        <button onclick="activateKey()">
            KÍCH HOẠT
        </button>

        <div id="message"></div>

    </div>

    <div class="footer">
        © 2026 MinhQuan Lock
    </div>

</div>

<script>
function activateKey() {
    const key = document.getElementById("key").value.trim();
    const message = document.getElementById("message");

    if (!key) {
        message.textContent = "Vui lòng nhập key.";
        return;
    }

    message.textContent =
        "Đã nhận key. Hệ thống xác thực chưa được kết nối.";
}
</script>

</body>
</html>
